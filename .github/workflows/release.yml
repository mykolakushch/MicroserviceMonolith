name: "Release and Publish"

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      nuget_username:
        description: 'NuGet.org profile username'
        required: false
        type: string

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  release:
    name: "Build, Test, Pack and Publish"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Verify tag matches package version
        if: github.ref_type == 'tag'
        run: |
          VERSION=$(grep -oP '(?<=<Version>)[^<]+' MicroserviceMonolith/MicroserviceMonolith.csproj | head -1)
          if [ "${GITHUB_REF_NAME#v}" != "$VERSION" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match <Version>${VERSION}</Version> in MicroserviceMonolith.csproj"
            exit 1
          fi

      - name: Restore dependencies
        run: dotnet restore

      - name: Build in Release mode
        run: dotnet build --configuration Release --no-restore

      - name: Run unit and integration tests
        run: dotnet test --configuration Release --no-build --verbosity normal

      - name: Pack NuGet package
        id: pack
        run: dotnet pack MicroserviceMonolith/MicroserviceMonolith.csproj --configuration Release --no-build --output ./artifacts

      - name: Prepare binary archive
        run: |
          for tfm in net8.0 net9.0 net10.0; do
            mkdir -p "./artifacts/binaries/$tfm"
            cp -r "MicroserviceMonolith/bin/Release/$tfm/"* "./artifacts/binaries/$tfm/"
          done
          VERSION=$(grep -oP '(?<=<Version>)[^<]+' MicroserviceMonolith/MicroserviceMonolith.csproj | head -1)
          cd ./artifacts && zip -r "MicroserviceMonolith-v${VERSION}-binaries.zip" binaries

      - name: Publish to GitHub Packages
        # Secondary registry: a failure here must be visible but must not block the NuGet.org release.
        continue-on-error: true
        run: |
          # GitHub Packages authenticates NuGet pushes with a source that carries credentials.
          dotnet nuget add source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" \
            --name github-packages \
            --username "${{ github.repository_owner }}" \
            --password "${{ secrets.GITHUB_TOKEN }}" \
            --store-password-in-clear-text
          dotnet nuget push ./artifacts/*.nupkg \
            --source github-packages \
            --api-key "${{ secrets.GITHUB_TOKEN }}" \
            --skip-duplicate

      - name: NuGet Login (OIDC Trusted Publishing)
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: ${{ inputs.nuget_username || vars.NUGET_USERNAME || 'Nikolay.Kusch' }}

      - name: Publish to NuGet.org
        run: |
          dotnet nuget push ./artifacts/*.nupkg \
            --source "https://api.nuget.org/v3/index.json" \
            --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" \
            --skip-duplicate

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: steps.pack.outcome == 'success'
        with:
          generate_release_notes: true
          files: |
            ./artifacts/*.nupkg
            ./artifacts/*.snupkg
            ./artifacts/MicroserviceMonolith-v*-binaries.zip
